# ==============================================================================
# Git Workflow Command Panel
# ------------------------------------------------------------------------------
# 用途: 注册 `git cmd` 快捷命令，用于查看 Git 初始化、日常提交、分支切换
#       以及常用操作的速查流程。
# 环境: Windows Git Bash / MinGW64
# 使用: source git-auto-setup.conf
# 执行: git cmd
# ==============================================================================

git config --global alias.cmd '!echo -e "

============================================================
Git Workflow Command Panel
Git 初始化 / 日常提交 / 远程分支 / 常用操作 速查面板
============================================================

===== 🚀一、Git 首次初始化 + 远程提交全套流程 =====
1. git init                                      初始化本地 Git 仓库
2. git add -A                                    添加整个仓库所有修改到暂存区
3. git commit -m \"init\"                          提交首次版本到本地仓库
4. git branch -M main                            将当前分支命名为 main
5. git remote add origin 仓库地址                绑定远程仓库地址
6. git push -u origin main                       首次推送到远程 main 分支，并建立关联
   git clone 仓库地址                            如果远程仓库已存在，可直接克隆

===== 🚀二、Git 日常提交修改 =====
1. git status                                    查看当前文件修改状态
2. git add -A                                    添加所有新增、修改、删除文件
3. git commit -m \"此次修改说明\"                  提交本地修改
4. git pull --rebase                             推送前拉取远程更新，减少合并提交
5. git push                                      推送本地提交到远程仓库

===== 🚀三、Git 切换远程分支 =====
1. git fetch                                     获取远程最新分支信息
2. git branch -r                                 查看所有远程分支
3. git switch -c 本地分支名 --track origin/远程分支名
                                                 创建本地分支并关联远程分支
   git checkout -b 本地分支名 origin/远程分支名  旧版 Git 可使用该写法
4. git switch 分支名                             切换到已有本地分支
   git checkout 分支名                           旧版 Git 可使用该写法
5. git pull                                      拉取当前分支远程最新代码

===== 🚀四、其他常用操作 =====
git status                                       查看当前状态
git branch                                       查看本地分支
git branch -a                                    查看本地和远程分支
git diff                                         查看未暂存的文件修改
git diff --staged                                查看已暂存的文件修改
git log --oneline                                查看简洁提交日志
git log --graph --oneline --decorate --all       查看分支图形日志
git remote -v                                    查看远程仓库地址
git remote set-url origin 新仓库地址             修改远程仓库地址
git stash push -m \"说明\"                         临时保存当前修改
git stash list                                   查看临时保存列表
git stash pop                                    恢复最近一次临时保存
git restore 文件名                               放弃指定文件未暂存修改
git restore --staged 文件名                      取消指定文件暂存
git reset --soft HEAD~1                          撤销最近一次提交，保留代码修改
git reset --hard HEAD~1                          危险：撤销最近一次提交，并丢弃代码修改

"'
